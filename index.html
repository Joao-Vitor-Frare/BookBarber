<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="config.js" defer></script>
    <script src="api.js" defer></script>
    <script src="script.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookBarber</title>
</head>
<body>
    <header class="barranav">
        <div class="logo">
            <a href="#inicio">
            <img src="media/logo-bookbarber.png" alt="Logo BookBarber">
            </a>
        </div>
        
        <nav>
            <img class="logo-menu-aberto" src="media/logo-bookbarber.png" alt="Logo BookBarber">
            <a href="#inicio">Início</a>
            <div class="risco"></div>
            <a href="#agenda">Agenda</a>
            <div class="risco"></div>
            <a href="#produtos">Produtos</a>
            <div class="risco"></div>
            <a href="#contato">Contato</a>
            <div class="risco"></div>
        </nav>

        <div class="botoes-direita">
            <a class="config-adm" href="admin.html">
                <img src="icon/config.png" alt="Configurações">
            </a>

            <button class="botao-menu" type="button" aria-label="Abrir menu">
                <span class="linha-menu"></span>
                <span class="linha-menu"></span>
                <span class="linha-menu"></span>
            </button>
        </div>
    </header>

    <section class="banner" id="inicio">
        <div class="escritas-banner">
        <h1 class="nome-banner" id="nomeBanner"></h1>
        <h2 class="desc-banner" id="descBanner"></h2>
        </div>
    </section>

    <section id="agenda">
        <h1 class="texto-agenda">Agende seu horário</h1>
        <p class="subtexto-agenda">Escolha um dia no calendário e depois selecione um horário disponível.</p>
        <div id="calendario"></div>
        <div id="horariosDisponiveis"></div>
    </section>

    <section id="produtos">
        <h1 class="texto-produtos">Nossos produtos</h1>

        <div class="carrossel-produtos">
            <button class="seta seta-esq" type="button">‹</button>
            <div class="trilho-produtos" id="trilhoProdutos"></div>
            <button class="seta seta-dir" type="button">›</button>
        </div>
    </section>

    <section id="contato">
    <h1 class="texto-contato">Contato</h1>
        <div class="info-contato">
            <p class="linha-contato">
                <span>Telefone:</span>
                <span id="telefoneContato"></span>
            </p>

            <p class="linha-contato">
                <span>Endereço:</span>
                <span id="enderecoContato"></span>
            </p>

            <div class="redes-contato">
                <a id="linkInstagram" href="#" target="_blank" rel="noopener">Instagram</a>
                <a id="linkWhatsapp" href="#" target="_blank" rel="noopener">WhatsApp</a>
            </div>
        </div>
    </section>

    <div id="modalAgendamento" class="modal-agendamento" aria-hidden="true">
      <div class="modal-conteudo" role="dialog" aria-modal="true" aria-labelledby="tituloModalAgendamento">
        <button type="button" id="fecharModalAgendamento" class="modal-fechar" aria-label="Fechar">×</button>
        <h2 id="tituloModalAgendamento">Confirmar agendamento</h2>
        <p id="resumoAgendamento" class="resumo-agendamento"></p>

        <form id="formAgendamento">
          <label>
            Seu nome
            <input id="agendamentoNome" type="text" autocomplete="name" required>
          </label>
          <label>
            E-mail
            <input id="agendamentoEmail" type="email" autocomplete="email" required>
          </label>
          <label>
            Telefone
            <input id="agendamentoTelefone" type="tel" autocomplete="tel" required>
          </label>
          <label>
            Serviço
            <select id="agendamentoServico" required></select>
          </label>
          <label>
            Barbeiro
            <select id="agendamentoBarbeiro">
              <option value="">Qualquer barbeiro disponível</option>
            </select>
          </label>
          <label>
            Observações (opcional)
            <textarea id="agendamentoObservacoes" rows="3"></textarea>
          </label>

          <button type="submit" class="botao-confirmar-agendamento">Reservar horário</button>
          <p id="mensagemAgendamento" class="mensagem-agendamento"></p>
        </form>
      </div>
    </div>
</body>
</html>
