<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="config.js" defer></script>
    <script src="script.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookBarber</title>
</head>
<body>
    <header class="barranav">
        <div class="logo">
            <a href="#inicio">
            <img src="/media/logo-bookbarber.png" alt="Logo BookBarber">
            </a>
        </div>
        
        <nav>
            <img class="logo-menu-aberto" src="/media/logo-bookbarber.png" alt="Logo BookBarber">
            <a href="#inicio">Início</a>
            <div class="risco"></div>
            <a href="#agenda">Agenda</a>
            <div class="risco"></div>
            <a href="#produtos">Produtos</a>
            <div class="risco"></div>
            <a href="#contato">Contato</a>
            <div class="risco"></div>
        </nav>

        <div class="botoes-direita">
            <a class="config-adm" href="admin.html">
                <img src="icon/config.png" alt="Configurações">
            </a>

            <button class="botao-menu" type="button">
                <span class="linha-menu"></span>
                <span class="linha-menu"></span>
                <span class="linha-menu"></span>
            </button>
        </div>
    </header>

    <section class="banner" id="inicio">
        <div class="escritas-banner">
        <h1 class="nome-banner" id="nomeBanner"></h1>
        <h2 class="desc-banner" id="descBanner"></h2>
        </div>
    </section>

    <section id="agenda">
        <h1 class="texto-agenda">Agende seu horário</h1>
        <div id="calendario"></div>
        <div id="horariosDisponiveis"></div>
    </section>

    <section id="produtos">
        <h1 class="texto-produtos">Nossos produtos</h1>

        <div class="carrossel-produtos">
            <button class="seta seta-esq" type="button">‹</button>
            <div class="trilho-produtos" id="trilhoProdutos"></div>
            <button class="seta seta-dir" type="button">›</button>
        </div>
    </section>

    <section id="contato">
    <h1 class="texto-contato">Contato</h1>
        <div class="info-contato">
            <p class="linha-contato">
                <img src="icon/telefone.png" alt="Telefone">
                <span id="telefoneContato"></span>
            </p>

            <p class="linha-contato">
                <img src="icon/local.png" alt="Endereço">
                <span id="enderecoContato"></span>
            </p>

            <div class="redes-contato">
                <a id="linkInstagram" href="#" target="_blank">Instagram</a>
                <a id="linkWhatsapp" href="#" target="_blank">WhatsApp</a>
            </div>
        </div>
    </section>
</body>
